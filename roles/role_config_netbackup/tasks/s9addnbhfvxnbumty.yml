---
- block:
    - name: Actualizar /etc/hosts para segmento 172.11.x.x
      blockinfile:
        path: "{{ filehosts }}"
        marker: "# {mark} ANSIBLE MANAGED NETBACKUP CFS 172.11"
        block: |
          172.11.101.39 vxnbumty
          172.11.110.85 cpdnbumedia5-le
          150.250.233.208 lopahcrespmx04_mty
          {{ nbkchpiprbt[0] }} {{ nbcltsfx }}
      when: 
        - nbkchpiprbt | length > 0
        - nbkchpiprbt[0].startswith('172.11.')
      register: hosts_update_17211

    - name: Actualizar /etc/hosts para segmento 172.13.x.x
      blockinfile:
        path: "{{ filehosts }}"
        marker: "# {mark} ANSIBLE MANAGED NETBACKUP CFS 172.13"
        block: |
          172.13.103.107 vxnbumty
          172.13.103.174 cpdnbumedia5-le
          150.250.233.208 lopahcrespmx04_mty
          {{ nbkchpiprbt[0] }} {{ nbcltsfx }}
      when: 
        - nbkchpiprbt | length > 0
        - nbkchpiprbt[0].startswith('172.13.')
      register: hosts_update_17213

    - name: Consolidar estado de hosts_update
      set_fact:
        hosts_update:
          changed: >-
            {{
              (hosts_update_17211.changed | default(false)) or
              (hosts_update_17213.changed | default(false))
            }}
  become: true
